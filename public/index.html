<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Manga Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            display: block;
        }

        .result.loading {
            background: #d1ecf1;
            border: 2px solid #0c5460;
            color: #0c5460;
            display: block;
        }

        .result h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .result pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #999;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 3px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Login</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">📧 Email Login</div>
            <div class="tab" onclick="switchTab('google')">🔵 Google Login</div>
        </div>

        <!-- Email Login -->
        <div id="login" class="tab-content active">
            <div class="info-box">
                💡 Trước tiên hãy đăng ký tài khoản mới, rồi đăng nhập xem code có chạy không
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>

            <button onclick="login()">Đăng Nhập</button>

            <div id="loginResult" class="result"></div>
        </div>

        <!-- Google Login -->
        <div id="google" class="tab-content">
            <div class="info-box">
                🔹 Test đăng nhập bằng Google (tạm thời chỉ là giả lập)
            </div>

            <div class="form-group">
                <label>Email Gmail:</label>
                <input type="email" id="googleEmail" placeholder="user@gmail.com">
            </div>

            <div class="form-group">
                <label>Tên:</label>
                <input type="text" id="googleName" placeholder="John Doe">
            </div>

            <button onclick="loginGoogle()">Đăng Nhập Google</button>

            <div id="googleResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/auth';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showResult(elementId, status, message, data = null) {
            const resultDiv = document.getElementById(elementId);
            resultDiv.className = `result ${status}`;

            let content = `<h3>${getMessage(status)}</h3><p>${message}</p>`;

            if (data) {
                content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }

            resultDiv.innerHTML = content;
        }

        function getMessage(status) {
            const messages = {
                success: '✅ Thành công!',
                error: '❌ Lỗi!',
                loading: '⏳ Đang xử lý...'
            };
            return messages[status] || 'Kết quả';
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showResult('loginResult', 'error', 'Vui lòng nhập email và mật khẩu');
                return;
            }

            showResult('loginResult', 'loading', 'Đang đăng nhập...');

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Lưu token vào localStorage
                    localStorage.setItem('token', data.data.token);
                    showResult('loginResult', 'success', 'Đăng nhập thành công!', data.data);
                } else {
                    showResult('loginResult', 'error', data.message || 'Đăng nhập thất bại', data);
                }
            } catch (error) {
                showResult('loginResult', 'error', 'Lỗi kết nối: ' + error.message);
            }
        }

        async function loginGoogle() {
            const email = document.getElementById('googleEmail').value;
            const name = document.getElementById('googleName').value;

            if (!email || !name) {
                showResult('googleResult', 'error', 'Vui lòng nhập email và tên');
                return;
            }

            showResult('googleResult', 'loading', 'Đang đăng nhập Google...');

            try {
                const response = await fetch(`${API_URL}/login-google`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        googleId: 'google_test_' + Date.now(),
                        name,
                        idToken: 'test_token'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.data.token);
                    showResult('googleResult', 'success', 'Google login thành công!', data.data);
                } else {
                    showResult('googleResult', 'error', data.message || 'Google login thất bại', data);
                }
            } catch (error) {
                showResult('googleResult', 'error', 'Lỗi kết nối: ' + error.message);
            }
        }

        // Hỗ trợ Enter key để submit
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                const activeTab = document.querySelector('.tab-content.active').id;
                if (activeTab === 'login') login();
                else if (activeTab === 'google') loginGoogle();
            }
        });
    </script>
</body>
</html>
